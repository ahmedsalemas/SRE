apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: default-viewer
  namespace: default
rules:
  - apiGroups: ["", "apps"]     
    resources: ["pods", "deployments", "services"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: default-viewer-binding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: intern-sa
    namespace: default
roleRef:
  kind: Role
  name: default-viewer
  apiGroup: rbac.authorization.k8s.io