apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-demo
  template:
    metadata:
      labels:
        app: postgres-demo
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_USER
              value: devops
            - name: POSTGRES_PASSWORD
              value: devops
            - name: POSTGRES_DB
              value: devops_app
          ports:
            - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-demo-service
spec:
  selector:
    app: postgres-demo
  ports:
    - port: 5432
      targetPort: 5432