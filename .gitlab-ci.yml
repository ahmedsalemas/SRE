stages:
  - build
  - test
  - scan
  - push
  - update-manifest

image: docker:24.0.5

services:
  - name: docker:24.0.5-dind
    command: ["--insecure-registry=host.docker.internal:8082"]


variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  NEXUS_REGISTRY: "host.docker.internal:8082"
  IMAGE_NAME: "$NEXUS_REGISTRY/devops-dummy-api"

build:
  stage: build
  script:
    - export IMAGE_TAG="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
    - cd api
    - docker build -t $IMAGE_NAME:$IMAGE_TAG .
    - docker save -o ../image.tar $IMAGE_NAME:$IMAGE_TAG
  artifacts:
    paths:
      - image.tar
    expire_in: 1 hour

test:
  stage: test
  image: node:20-alpine
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_USER: devops
    POSTGRES_PASSWORD: devops
    POSTGRES_DB: devops_app
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_USER: devops
    DB_PASSWORD: devops
    DB_NAME: devops_app
  before_script:
    - apk add --no-cache postgresql-client
    - PGPASSWORD=devops psql -h postgres -U devops -d devops_app -f ../db/init.sql
  script:
    - cd api
    - npm install
    - npm test

scan:
  stage: scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - trivy image --input image.tar --severity HIGH,CRITICAL --exit-code 1 --ignorefile .trivyignore

push:
  stage: push
  script:
    - export IMAGE_TAG="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
    - docker load -i image.tar
    - echo "$NEXUS_PASS" | docker login $NEXUS_REGISTRY -u "$NEXUS_USER" --password-stdin
    - docker push $IMAGE_NAME:$IMAGE_TAG

update-manifest:
  stage: update-manifest
  script:
    - echo "Would update k8s manifest repo with new tag $IMAGE_TAG"